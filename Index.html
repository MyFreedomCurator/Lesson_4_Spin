<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо-рулетка D&D</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: radial-gradient(circle at 50% 20%, #2b2f4a, #14162a 70%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    padding: 20px;
    gap: 18px;
  }

  h1 {
    margin: 0;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
    font-size: clamp(1.1rem, 3vw, 1.7rem);
    text-align: center;
  }

  /* Кнопки тем */
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 900px;
  }

  .topic-btn {
    padding: 10px 20px;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .5px;
    color: #eaeaea;
    background: linear-gradient(180deg, #3a3f63, #262a45);
    border: 2px solid #4a5078;
    border-radius: 30px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 3px 0 #1c1e33, 0 5px 15px rgba(0,0,0,.4);
    white-space: nowrap;
  }
  .topic-btn:hover:not(.active):not(:disabled) {
    filter: brightness(1.2);
    border-color: #6d75a8;
  }
  .topic-btn.active {
    background: linear-gradient(180deg, #ffe27a, #ffc42e);
    color: #1c1e33;
    border-color: #ffd54a;
    box-shadow: 0 3px 0 #b7860f, 0 0 20px rgba(255,213,74,.5);
  }
  .topic-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  /* Колесо */
  .wheel-wrapper {
    position: relative;
    width: min(88vw, 560px);
    aspect-ratio: 1 / 1;
  }

  .pointer {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 38px solid #ffd54a;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.7));
    z-index: 5;
  }

  .hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 14%;
    aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #c7c7c7 60%, #8a8a8a);
    box-shadow: 0 0 0 6px #1c1e33, 0 6px 18px rgba(0,0,0,.7);
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #333;
    font-size: clamp(9px, 2vw, 14px);
    user-select: none;
    cursor: pointer;
    text-align: center;
    line-height: 1;
    padding: 4px;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 0 0 10px #1c1e33, 0 0 40px rgba(0,0,0,.8);
  }

  .spin-btn {
    padding: 14px 44px;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #1c1e33;
    background: linear-gradient(180deg, #ffe27a, #ffc42e);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #b7860f, 0 10px 25px rgba(0,0,0,.5);
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  .spin-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .spin-btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b7860f, 0 5px 15px rgba(0,0,0,.5);
  }
  .spin-btn:disabled {
    cursor: not-allowed;
    filter: grayscale(.5) brightness(.8);
  }

  .result {
    font-size: 1.15rem;
    min-height: 1.6em;
    text-align: center;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
    max-width: 700px;
    padding: 0 10px;
  }
  .result .label {
    display: block;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #8f97c5;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .result .win {
    color: #ffd54a;
    font-size: 1.35rem;
    text-shadow: 0 0 20px rgba(255,213,74,.5);
  }
  .result .placeholder {
    color: #7a80a8;
    font-weight: 500;
    font-size: 1rem;
  }

  /* Модальное окно с полным списком */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1c1f36;
    border: 2px solid #4a5078;
    border-radius: 16px;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.8);
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid #333a5c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: #ffd54a;
    letter-spacing: .5px;
  }
  .modal-close {
    background: none;
    border: none;
    color: #aaa;
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 6px;
  }
  .modal-close:hover { color: #fff; }
  .modal-list {
    overflow-y: auto;
    padding: 8px 20px 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .modal-list li {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: .92rem;
    display: flex;
    gap: 10px;
    align-items: baseline;
    color: #d7dcff;
  }
  .modal-list li:nth-child(odd) { background: rgba(255,255,255,.03); }
  .modal-list li .num {
    color: #6d75a8;
    font-size: .8rem;
    min-width: 24px;
    text-align: right;
    font-weight: 700;
  }

  .info-hint {
    font-size: .8rem;
    color: #6d75a8;
    text-align: center;
    max-width: 640px;
  }
  .info-hint button {
    background: none;
    border: none;
    color: #9aa3d8;
    text-decoration: underline;
    cursor: pointer;
    font-size: inherit;
    padding: 0 4px;
  }
  .info-hint button:hover { color: #ffd54a; }
</style>
</head>
<body>

  <h1>🎲 Создайте крутую новеллу!</h1>

  <div class="topics" id="topics"></div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800"></canvas>
    <div class="hub" id="hub">Нажимай!</div>
  </div>

  <button class="spin-btn" id="spinBtn" disabled>Выберите тему</button>
  <div class="result" id="result"><span class="placeholder">Нажмите одну из кнопок темы выше, чтобы заполнить колесо</span></div>


  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Список</h2>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <ol class="modal-list" id="modalList"></ol>
    </div>
  </div>

  // ============================================================
  //  Инициализация
  // ============================================================
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('result');
  const topicsEl = document.getElementById('topics');
  const hub = document.getElementById('hub');

  const SIZE = canvas.width;
  const CENTER = SIZE / 2;
  const RADIUS = CENTER - 14;

  let currentTopic = null;
  let currentItems = [];      // массив выбранной темы (50 шт.)
  let currentSegments = [];   // подвыборка для отображения на колесе (<= 12)
  let rotation = 0;
  let spinning = false;

  // Палитра для секторов
  const PALETTE = [
    '#e74c3c','#f39c12','#f1c40f','#2ecc71','#1abc9c','#3498db',
    '#9b59b6','#e91e63','#34495e','#16a085','#d35400','#8e44ad',
    '#c0392b','#27ae60','#2980b9','#8e44ad','#f39c12','#1abc9c'
  ];

  // Сколько секторов рисуем на колесе (из 50 возможных вариантов)
  const VISIBLE_SEGMENTS = 10;

  // ============================================================
  //  Создаём кнопки тем
  // ============================================================
  Object.keys(TOPICS).forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.textContent = topic;
    btn.dataset.topic = topic;
    btn.addEventListener('click', () => selectTopic(topic, btn));
    topicsEl.appendChild(btn);
  });

  // ============================================================
  //  Выбор темы
  // ============================================================
  function selectTopic(topic, btn) {
    if (spinning) return;

    // Сбросить активные
    document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentTopic = topic;
    currentItems = TOPICS[topic];

    // Готовим подвыборку для колеса (первый VISIBLE_SEGMENTS вариантов)
    // Но перед прокруткой перемешиваем все 50, чтобы выбор был равновероятным
    currentSegments = shuffle([...currentItems]).slice(0, VISIBLE_SEGMENTS);

    // Обновляем подписи цветов
    currentSegments = currentSegments.map((label, i) => ({
      label: shorten(label),
      full: label,
      color: PALETTE[i % PALETTE.length]
    }));

    rotation = 0;
    drawWheel();

    spinBtn.disabled = false;
    spinBtn.textContent = 'Крутить!';
    resultEl.innerHTML = `<span class="label">Тема: ${topic}</span><span class="placeholder">Нажмите «Крутить», чтобы получить случайный вариант из 50</span>`;
  }

  // Перемешивание Фишера–Йетса
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Сокращаем длинный текст для отображения на секторе
  function shorten(text, max = 26) {
    if (text.length <= max) return text;
    return text.slice(0, max - 1).trim() + '…';
  }

  // ============================================================
  //  Отрисовка колеса
  // ============================================================
  function drawWheel() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Внешнее кольцо
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, RADIUS + 8, 0, Math.PI * 2);
    ctx.fillStyle = '#1c1e33';
    ctx.fill();

    if (!currentSegments.length) {
      // Пустое колесо-заглушка
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#262a45';
      ctx.fill();
      ctx.fillStyle = '#6d75a8';
      ctx.font = 'bold 30px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Выберите тему', CENTER, CENTER);
      return;
    }

    const N = currentSegments.length;
    const arc = (Math.PI * 2) / N;

    for (let i = 0; i < N; i++) {
      const start = rotation + i * arc;
      const end = start + arc;

      ctx.beginPath();
      ctx.moveTo(CENTER, CENTER);
      ctx.arc(CENTER, CENTER, RADIUS, start, end);
      ctx.closePath();
      ctx.fillStyle = currentSegments[i].color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Текст
      ctx.save();
      ctx.translate(CENTER, CENTER);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      const fontSize = N > 8 ? 20 : 24;
      ctx.font = `bold ${fontSize}px Segoe UI, sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,.7)';
      ctx.shadowBlur = 4;
      ctx.fillText(currentSegments[i].label, RADIUS - 20, 0);
      ctx.restore();
    }

    // Деления
    for (let i = 0; i < N; i++) {
      const a = rotation + i * arc;
      ctx.beginPath();
      ctx.moveTo(CENTER + Math.cos(a) * (RADIUS - 4), CENTER + Math.sin(a) * (RADIUS - 4));
      ctx.lineTo(CENTER + Math.cos(a) * RADIUS, CENTER + Math.sin(a) * RADIUS);
      ctx.strokeStyle = 'rgba(255,255,255,.65)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // Определяем сектор под указателем сверху
  function getWinningIndex() {
    const pointerAngle = -Math.PI / 2;
    let rel = (pointerAngle - rotation) % (Math.PI * 2);
    if (rel < 0) rel += Math.PI * 2;
    const N = currentSegments.length;
    return Math.floor(rel / ((Math.PI * 2) / N)) % N;
  }

  // ============================================================
  //  Вращение
  // ============================================================
  function spin() {
    if (spinning || !currentSegments.length) return;
    spinning = true;
    spinBtn.disabled = true;
    document.querySelectorAll('.topic-btn').forEach(b => b.disabled = true);
    resultEl.innerHTML = `<span class="label">Тема: ${currentTopic}</span><span class="placeholder">Крутим...</span>`;

    const startRotation = rotation;
    const extraTurns = 6 + Math.floor(Math.random() * 4);
    const randomAngle = Math.random() * Math.PI * 2;
    const totalDelta = extraTurns * Math.PI * 2 + randomAngle;
    const duration = 4500 + Math.random() * 1500;
    const startTime = performance.now();

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(t);

      rotation = startRotation + totalDelta * eased;
      drawWheel();

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        rotation = rotation % (Math.PI * 2);
        drawWheel();

        const idx = getWinningIndex();
        const win = currentSegments[idx];

        // Финальный выбор — берём случайный вариант из ВСЕХ 50,
        // но синхронизируем с показанным на колесе (для честности показываем именно его)
        resultEl.innerHTML =
          `<span class="label">Тема: ${currentTopic}</span>` +
          `<span class="win">${win.full}</span>`;

        spinning = false;
        spinBtn.disabled = false;
        document.querySelectorAll('.topic-btn').forEach(b => b.disabled = false);
      }
    }

    requestAnimationFrame(animate);
  }

  spinBtn.addEventListener('click', spin);
  hub.addEventListener('click', spin);

  // ============================================================
  //  Модальное окно со списком всех 50 вариантов текущей темы
  // ============================================================
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalList = document.getElementById('modalList');

  document.getElementById('showList').addEventListener('click', () => {
    if (!currentTopic) {
      modalTitle.textContent = 'Сначала выберите тему';
      modalList.innerHTML = '';
    } else {
      modalTitle.textContent = `Все 50 вариантов: ${currentTopic}`;
      modalList.innerHTML = currentItems
        .map((item, i) => `<li><span class="num">${i + 1}.</span><span>${escapeHtml(item)}</span></li>`)
        .join('');
    }
    modalOverlay.classList.add('show');
  });

  document.getElementById('modalClose').addEventListener('click', () => {
    modalOverlay.classList.remove('show');
  });
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Первичная отрисовка пустого колеса
  drawWheel();
})();
